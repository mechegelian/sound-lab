<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111311" />
    <title>sound LAB — by Mehmet</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="instrument">
      <header class="transport">
        <a
          class="identity"
          href="#instrument-editor"
          aria-label="sound LAB, jump to sound editor"
          >sound <strong>LAB</strong><span>by Mehmet</span></a
        >
        <div class="transport-actions" aria-label="Transport">
          <button id="startButton" class="start-button">Start audio</button>
          <button id="playAllButton" title="Play all five channels">
            <span aria-hidden="true">▸</span> Play
          </button>
          <button id="stopAllButton" title="Stop transport and all channels">
            <span aria-hidden="true">▪</span> Stop
          </button>
          <button id="randomButton" title="Generate new Acid and Drum patterns">
            Randomize
          </button>
        </div>
        <label class="tempo"
          >BPM
          <input
            id="bpm"
            type="number"
            min="70"
            max="180"
            value="108"
            aria-label="Tempo in beats per minute"
        /></label>
        <button
          id="sceneShortcut"
          class="scene-shortcut"
          aria-controls="global-panel"
          aria-expanded="false"
        >
          <span>SCENE</span><b id="sceneSummary">FOG</b
          ><span aria-hidden="true">↗</span>
        </button>
        <label class="output-control" for="output"
          >OUTPUT <output id="outputValue">−0.7 dB</output
          ><input
            id="output"
            type="range"
            min="0"
            max="120"
            value="92"
            aria-label="Master output"
        /></label>
      </header>
      <section class="visualizer" aria-label="Live audio visualization">
        <div class="section-bar">
          <div
            class="mode-switch"
            role="tablist"
            aria-label="Visualization mode"
          >
            <button
              id="viz-wave"
              role="tab"
              aria-selected="true"
              aria-controls="visual-display"
              data-viz="wave"
            >
              Wave
            </button>
            <button
              id="viz-spectrum"
              role="tab"
              aria-selected="false"
              aria-controls="visual-display"
              tabindex="-1"
              data-viz="spectrum"
            >
              Spectrum
            </button>
            <button
              id="viz-spectrogram"
              role="tab"
              aria-selected="false"
              aria-controls="visual-display"
              tabindex="-1"
              data-viz="spectrogram"
            >
              Spectrogram
            </button>
          </div>
          <div class="visual-tools">
            <span id="sampleRate" class="technical">AUDIO OFFLINE</span>
            <button id="vizPause" aria-pressed="false">Pause</button>
            <button id="vizHold" aria-pressed="false">Hold</button>
            <button id="vizClear" hidden>Clear</button>
            <button
              id="vizSettings"
              aria-expanded="false"
              aria-controls="visual-settings"
            >
              Settings <span aria-hidden="true">+</span>
            </button>
          </div>
        </div>
        <div id="visual-display" role="tabpanel" aria-labelledby="viz-wave">
          <canvas id="scope" aria-label="Live master output waveform"></canvas>
          <div class="scope-caption">
            <span id="vizDescription">POST FX / WAVEFORM</span
            ><span id="signalState">AWAITING AUDIO</span>
          </div>
        </div>
        <div id="visual-settings" class="visual-settings" hidden></div>
      </section>
      <section class="workbench" aria-label="Sound workstation">
        <nav class="channels" aria-label="Sound channels">
          <div class="section-bar">
            <span class="eyebrow">01 — SIGNALS</span
            ><span class="technical" id="activeCount">0 / 5</span>
          </div>
          <div id="channelList"></div>
          <div class="channel-foot">
            <span class="status-dot" id="audioDot"></span
            ><span id="audioStatus">AUDIO OFF</span>
          </div>
        </nav>
        <section
          id="instrument-editor"
          class="editor"
          aria-label="Selected sound editor"
          tabindex="-1"
        >
          <div class="editor-heading">
            <div>
              <span class="eyebrow">02 — EDITOR</span>
              <h1 id="editorTitle">ACID</h1>
              <p id="editorDescription">Resonant square / step & accent</p>
            </div>
            <div
              id="editorTabs"
              class="mode-switch"
              role="tablist"
              aria-label="Sound editor mode"
            ></div>
          </div>
          <div id="editorContent" role="tabpanel"></div>
        </section>
      </section>
      <section class="global-area" aria-label="Global controls">
        <div class="global-bar">
          <div class="global-tabs" aria-label="Global settings">
            <button
              data-global="music"
              aria-expanded="false"
              aria-controls="global-panel"
            >
              Music <span>+</span>
            </button>
            <button
              data-global="fx"
              aria-expanded="false"
              aria-controls="global-panel"
            >
              FX <span>+</span>
            </button>
            <button
              data-global="texture"
              aria-expanded="false"
              aria-controls="global-panel"
            >
              Texture <span>+</span>
            </button>
            <button
              data-global="mix"
              aria-expanded="false"
              aria-controls="global-panel"
            >
              Mix <span>+</span>
            </button>
            <button
              data-global="glitch"
              aria-expanded="false"
              aria-controls="global-panel"
            >
              Glitch <span>+</span>
            </button>
          </div>
          <div class="glitch-performance">
            <button id="triggerGlitchButton">↯ Trigger glitch</button
            ><button id="autoGlitch" aria-pressed="false">
              Auto <span>OFF</span>
            </button>
          </div>
        </div>
        <div id="global-panel" hidden></div>
      </section>
      <footer class="instrument-footer">
        <p id="message" role="status" aria-live="polite">
          Start audio to open the instrument. Select a channel to edit.
        </p>
        <span>sound LAB / experimental instrument</span>
      </footer>
    </main>
    <noscript
      >This instrument requires JavaScript to synthesize audio.</noscript
    >
  </body>
</html>
